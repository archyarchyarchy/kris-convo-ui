name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build module.zip
        run: |
          zip -r module.zip module.json scripts styles templates README.md LICENSE

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.zip
            module.json
